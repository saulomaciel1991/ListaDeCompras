<ion-app>
  <ion-menu side="start" menuId="main-menu" contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list lines="none">
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/lists" routerDirection="root" detail="false">
            <ion-icon name="cart-outline" slot="start" color="primary"></ion-icon>
            <ion-label>Listas de Compras</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/products" routerDirection="root" detail="false">
            <ion-icon name="cube-outline" slot="start" color="primary"></ion-icon>
            <ion-label>Catálogo de Produtos</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/categories" routerDirection="root" detail="false">
            <ion-icon name="pricetag-outline" slot="start" color="primary"></ion-icon>
            <ion-label>Categorias</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/settings" routerDirection="root" detail="false">
            <ion-icon name="settings-outline" slot="start" color="primary"></ion-icon>
            <ion-label>Configurações & Backup</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
